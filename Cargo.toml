[workspace]
members = ["kernel", "lpc176x", "monolink-proto"]
# tools/monolink lives outside the workspace — it builds for the host while
# everything inside this workspace builds for thumbv7m-none-eabi per
# .cargo/config.toml. It path-depends on monolink-proto across the boundary.
exclude = ["tools/monolink"]
resolver = "3"

[workspace.dependencies]
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["device"] }
