[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lib]
test = false

[features]
default = ["lm3s6965evb"]
lm3s6965evb = []
lpc1768 = []

[dependencies]
cortex-m = "0.7"
# `device` feature suppresses cortex-m-rt's placeholder `__INTERRUPTS` so we
# can provide our own per-board vector table. Each board module supplies its
# `__INTERRUPTS`; `kernel/memory/device.x` covers the link-script INCLUDE.
cortex-m-rt = { version = "0.7", features = ["device"] }
cortex-m-semihosting = "0.5"

[[test]]
name = "should_panic"
harness = false
