- name: lpc_iap_32
  description: LPC17xx IAP 32kB Flash
  default: true
  instructions: 
  load_address: 0x10000008
  pc_init: 0xd
  pc_uninit: 0x95
  pc_program_page: 0x11f
  pc_erase_sector: 0xd9
  pc_erase_all: 0x99
  data_section_offset: 0x1a4
  rtt_poll_interval: 0
  flash_properties:
    address_range:
      start: 0x0
      end: 0x8000
    page_size: 0x400
    erased_byte_value: 0xff
    program_page_timeout: 300
    erase_sector_timeout: 3000
