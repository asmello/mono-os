[package]
name = "umami-os"
version = "0.1.0"
edition = "2024"

# no deps on test and bench since they depend on stdlib
# compiling thusly with --all-targets gives errors, e.g.,
# panic handler defined twice
[[bin]]
bench = false
name = "umami-os"
test = false

# TODO: can we use newer versions?
[dependencies]
bootloader = "0.9"
spin = { version = "0.10.0", features = ["lazy"] }
volatile = "0.2"
yore = { git = "https://github.com/asmello/yore.git", default-features = false }
